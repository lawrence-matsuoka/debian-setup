# add the following line to .bashrc
# eval "$(starship init bash)"

# Add $git_status\ underneath git branch
format = """
[░▒▓](#a3aed2)\
[  ](bg:#a3aed2 fg:#090c0c)\
[](bg:#7ebae4 fg:#a3aed2)\
$directory\
[](fg:#7ebae4 bg:#5277c3)\
$git_branch\
[](fg:#5277c3 bg:#212736)\
$c\
$cpp\
$python\
$nodejs\
$rust\
$golang\
[](fg:#212736 bg:#1d2230)\
$nix_shell
$time\
[ ](fg:#1d2230)\
\n$character"""

[directory]
style = "fg:#e3e5e5 bg:#7ebae4"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "../"
fish_style_pwd_dir_length = 1

[directory.substitutions]
"Documents" = ""
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "

[git_branch]
symbol = "󰊢"
style = "bg:#5277c3"
format = '[[ $symbol $branch ](fg:#7ebae4 bg:#5277c3)]($style)'

#[git_status]
#conflicted = "󰘕"
#ahead = "󰁔"
#behind = "󰁍"
#diverged = "󰘬"
#up_to_date = "󰄬"
#untracked = "󰅖"
#stashed = "📦"
#modified = "📝"
#renamed = "󰑕"
#deleted = "󰆴"

[c]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#7ebae4 bg:#212736)]($style)'

[cpp]
symbol = "󰙲"
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#7ebae4 bg:#212736)]($style)'

[cmake]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#7ebae4 bg:#212736)]($style)'

[python]
symbol = "󰌠"
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#7ebae4 bg:#212736)]($style)'

[nodejs]
symbol = "󰎙"
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#7ebae4 bg:#212736)]($style)'

[rust]
symbol = "󱘗"
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#7ebae4 bg:#212736)]($style)'

[golang]
symbol = "󰟓"
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#7ebae4 bg:#212736)]($style)'

[nix_shell]
style = "fg:#e3e5e5 bg:#1d2230)"
format = '[$state( \(\))]() '
impure_msg = '󰼩'
pure_msg = '󱩰'
unknown_msg = '󰜗'

[time]
disabled = true
time_format = "%R" # Hour:Minute Format
style = "bg:#1d2230"
format = '[[  $time ](fg:#a0a9cb bg:#1d2230)]($style)'

